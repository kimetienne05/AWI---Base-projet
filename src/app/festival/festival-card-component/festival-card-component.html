<article class="max-w-md mx-auto my-8 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition-shadow p-6 font-sans">

  <header class="border-b border-slate-100 pb-4 mb-4">
    <span class="inline-block px-2.5 py-1 text-xs font-semibold text-indigo-700 bg-indigo-50 rounded-full mb-2">
      Administration
    </span>
    <h1 class="text-xl font-bold text-slate-900 tracking-tight">
      Page de modification du festival
    </h1>
  </header>

  <div class="space-y-3">
    <!-- Computed Label -->
    <h2 class="text-lg font-semibold text-indigo-600">
      {{ editionLabel() }}
    </h2>

    <div class="bg-slate-50 rounded-xl p-4 space-y-2 text-sm text-slate-700">
      <p class="flex items-center justify-between">
        <span class="text-slate-500 font-medium">Lieu :</span>
        <span class="font-semibold text-slate-900">{{ festival().location }}</span>
      </p>

      <p class="flex items-center justify-between">
        <span class="text-slate-500 font-medium">Année en cours :</span>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-md font-mono font-bold bg-slate-200 text-slate-800">
          {{ festival().year }}
        </span>
      </p>
    </div>
  </div>

  <!-- Bouton d'action -->
  <div class="mt-6">
    <button
      type="button"
      (click)="incrementYear()"
      class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-sm font-medium rounded-xl shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      Augmenter l'année de l'édition
    </button>
  </div>

</article>
